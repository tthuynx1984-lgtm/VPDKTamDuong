/* ---------- 1. Hồ sơ BPKT ---------- */
function mountBpkt(root){
/* ===================== ĐỌC FILE EXCEL (xlsx, xlsm, xls, ods, csv, tsv, html) ===================== */
const MAXCOL = 70;   // chỉ đọc tối đa 70 cột đầu của mỗi sheet

function xmlDecode(s) {
  return s.replace(/&#x([0-9a-fA-F]+);/g, (_, h) => String.fromCodePoint(parseInt(h, 16)))
    .replace(/&#(\d+);/g, (_, d) => String.fromCodePoint(+d))
    .replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&apos;/g, "'").replace(/&amp;/g, '&');
}
function attrs(s) { const o = {}; s.replace(/([\w:.-]+)\s*=\s*"([^"]*)"/g, (_, k, v) => { o[k] = v; return ''; }); return o; }

  const rows = [];
  for (let r = 0; r <= maxRow; r++) {
    const m = map.get(r); if (!m) { rows.push([]); continue; }
    let mx = -1; m.forEach((_, c) => { if (c > mx) mx = c; });
    const arr = new Array(mx + 1).fill('');
    m.forEach((v, c) => arr[c] = v); rows.push(arr);
  }

}

// ---------- XLSX / XLSM ----------
async function readXlsx(buf) {
  const zip = await JSZip.loadAsync(buf);
  const txt = async p => { const f = zip.file(p); return f ? await f.async('string') : ''; };
  const wbx = await txt('xl/workbook.xml');
  if (!wbx) throw new Error('Không phải file xlsx hợp lệ');
  const relx = await txt('xl/_rels/workbook.xml.rels');
  const rels = {}; (relx.match(/<Relationship\b[^>]*>/g) || []).forEach(t => { const a = attrs(t); rels[a.Id] = a.Target; });
  const sst = []; const sx = await txt('xl/sharedStrings.xml');
  if (sx) (sx.match(/<si\b[\s\S]*?<\/si>|<si\s*\/>/g) || []).forEach(si => {
    const clean = si.replace(/<rPh\b[\s\S]*?<\/rPh>/g, '');
    let out = ''; clean.replace(/<t\b[^>]*>([\s\S]*?)<\/t>/g, (_, t) => { out += t; return ''; });
    sst.push(xmlDecode(out));

  const sheets = [];
  const defs = wbx.match(/<sheet\b[^>]*>/g) || [];
  for (const d of defs) {
    const a = attrs(d); let tgt = rels[a['r:id']]; if (!tgt) continue;
    tgt = tgt.replace(/^\/?(xl\/)?/, 'xl/');
    const xml = await txt(tgt); const map = new Map(); let maxRow = -1;
    const re = /<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g; let m;
    while ((m = re.exec(xml))) {

      const r = +rm[2] - 1, tm = at.match(/\bt="(\w+)"/), t = tm ? tm[1] : 'n';
      let val = '';
      if (t === 'inlineStr') { let o = ''; body.replace(/<t\b[^>]*>([\s\S]*?)<\/t>/g, (_, x) => { o += x; return ''; }); val = xmlDecode(o); }
      else { const vm = body.match(/<v>([\s\S]*?)<\/v>/); if (!vm) continue;
        if (t === 's') val = sst[+vm[1]] || ''; else if (t === 'str') val = xmlDecode(vm[1]);
        else if (t === 'e') val = ''; else if (t === 'b') val = vm[1] === '1' ? 'TRUE' : 'FALSE';
        else { val = parseFloat(vm[1]); if (isNaN(val)) val = xmlDecode(vm[1]); } }

      row.set(c, val); if (r > maxRow) maxRow = r;

    sheets.push({ name: xmlDecode(a.name), rows: finishRows(map, maxRow), hidden: a.state === 'hidden' });
  }

}

// ---------- ODS ----------
async function readOds(buf) {
  const zip = await JSZip.loadAsync(buf);
  const f = zip.file('content.xml'); if (!f) throw new Error('Không phải file ods hợp lệ');
  const xml = await f.async('string'); const sheets = [];
  const parts = xml.split(/<table:table\s/).slice(1);

    const end = part.indexOf('</table:table>'); if (end >= 0) part = part.slice(0, end);
    const name = xmlDecode((part.match(/table:name="([^"]*)"/) || [, 'Sheet'])[1]);
    const map = new Map(); let r = 0, maxRow = -1;
    const rowRe = /<table:table-row\b([^>]*?)(?:\/>|>([\s\S]*?)<\/table:table-row>)/g; let rm;
    while ((rm = rowRe.exec(part))) {
      const ra = attrs(rm[1]), rep = +(ra['table:number-rows-repeated'] || 1), body = rm[2] || '';

      while ((cm = cellRe.exec(body))) {

        else if (vt === 'date') val = ca['office:date-value'] || '';
        else if (vt === 'boolean') val = ca['office:boolean-value'] === 'true' ? 'TRUE' : 'FALSE';
        else if (vt === 'string' || cm[3]) {

        }
        if (val !== '' && !(typeof val === 'number' && isNaN(val))) for (let k = 0; k < Math.min(crep, 5) && c + k < MAXCOL; k++) cells.set(c + k, val);

  }
  return sheets;
}

function readOLE(u8) {

    const nl = ddv.getUint16(i + 64, true); let name = ''; for (let k = 0; k < (nl - 2) / 2; k++) name += String.fromCharCode(ddv.getUint16(i + k * 2, true));

  if (!wbE) throw new Error('Không tìm thấy dữ liệu bảng tính trong file .xls');
  return stream(wbE);
}

  if (A.blankChuaTotal) internal += `<li><b>${A.blankChuaTotal} hồ sơ không có ngày nhận (xem là RÚT) vẫn bị THỐNG KÊ tính vào "Chưa thực hiện" theo cán bộ</b>${Object.keys(A.blankChua).length ? ': ' + Object.keys(A.blankChua).map(n => esc(n) + ' ' + A.blankChua[n]).join(', ') : ''}. Theo quy ước, các hồ sơ này phải loại khỏi bảng tồn.</li>`;

async function csvDownload(name, rows) {
  const t = '\uFEFF' + rows.map(r => r.map(v => { v = String(v == null ? '' : v); return /[",\n;]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(',')).join('\r\n');
  if (window.claude && claude.use) {
    try { const dl = await claude.use('downloads'); if (dl) { await dl.save({ filename: name, data: t }); return; } }
    catch (e) { if (e && e.code !== 'unavailable') return; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([t], { type: 'text/csv;charset=utf-8' })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

  csvDownload('ho-so-ton.csv', [['Xã', 'Địa bàn', 'Mã hồ sơ', 'Tên', 'Tờ', 'Thửa', 'SĐT', 'Cán bộ', 'Loại thủ tục', 'Ngày nhận', 'Số ngày tồn', 'Nguồn']].concat(tonList().map(({ r, days }) => [r.xa, r.dia, r.ma, r.ten, r.to, r.thua, r.sdt, cbName(r), r.loai, vn(r.nhan), days == null ? '' : days, r.src + ' · dòng ' + r.row])));

  else if (a === 'he') { c.he = Math.max(0, (+t.value || 1) - 1); const m = matchFields(sh.rows, c.he, c.ncol || 30); c.map = { ...m.map }; }
  else if (a === 'col') { const f = FIELD_DEFS.find(x => x.k === t.dataset.f); if (f.multi) c.map[f.k] = [...t.selectedOptions].map(o => +o.value); else if (t.value === '') delete c.map[f.k]; else c.map[f.k] = +t.value; c.ok = true; }
  if (c.xa && c.map.ten != null && a !== 'inc' && !c.include) c.include = true;
  saveCfg(s); persist(s); rebuild();
});
$('refresh').onclick = () => { checkWatch(); rebuild(); };
$('pickBtn').onclick = pickFiles;
async function clearAll() {
  if (!ST.sources.length) { uiAlert('Chưa có file nào được nạp.'); return; }
  if (!(await uiConfirm('Xóa toàn bộ ' + ST.sources.length + ' file đã nạp và dữ liệu tổng hợp?\n(File Excel gốc trên máy không bị xóa. Cấu hình cột đã chọn vẫn được nhớ.)'))) return;
  for (const s of ST.sources) await DB.del(s.name);
  ST.sources = []; ST.errors = []; S.q = ''; S.open = {}; GD.mod = 0;
  rebuild(); setLive('ok');
}
$('clearBtn').onclick = clearAll;
$('prev').onclick = () => { S.ref = shift(S.ref, S.unit, -1); render(); };
$('next').onclick = () => { S.ref = shift(S.ref, S.unit, 1); render(); };
$('today').onclick = () => { S.ref = new Date(); render(); };
// kéo thả
['dragenter', 'dragover'].forEach(ev => root.addEventListener(ev, e => { e.preventDefault(); APP.classList.add('dragging'); }));
['dragleave', 'drop'].forEach(ev => root.addEventListener(ev, e => { e.preventDefault(); if (ev === 'drop' || e.target === document.documentElement || !e.relatedTarget) APP.classList.remove('dragging'); }));
root.addEventListener('drop', async e => {
  const items = [...(e.dataTransfer.items || [])].filter(i => i.kind === 'file'), files = [...(e.dataTransfer.files || [])];
  const hs = []; for (const it of items) { try { hs.push(it.getAsFileSystemHandle ? await it.getAsFileSystemHandle() : null); } catch (x) { hs.push(null); } }
  for (let i = 0; i < files.length; i++) { const h = hs[i] && hs[i].kind === 'file' ? hs[i] : null; await loadFile(h ? await h.getFile() : files[i], h); }
});
setInterval(() => { if (!document.hidden) checkWatch(); }, 4000);
render(); setLive('ok'); restore().then(() => { setLive('ok'); if (GD.on) syncDrive(true); });



return {show:function(){}};
}

 const s=$('md');s.innerHTML=ids.map(i=>`<option value="${i}">Model ${i} (${R.models[i].prims.length})</option>`).join('');s.hidden=ids.length<2;s.onchange=()=>useModel(s.value);useModel(ids[0]);if(save){dbPut(name,u8.slice()).catch(()=>{});try{localStorage.setItem('last',name)}catch(e){}}}
$('f').onchange=e=>e.target.files[0]&&load(e.target.files[0]);
root.host.ondragover=e=>e.preventDefault();root.host.ondrop=e=>{e.preventDefault();e.dataTransfer.files[0]&&load(e.dataTransfer.files[0])};
$('fit').onclick=()=>M&&fit();$('lb').onclick=()=>{const l=$('lv');l.style.display=l.style.display==='block'?'none':'block'};
$('q').onkeydown=e=>{if(e.key!=='Enter'||!M)return;const k=e.target.value.trim().toLowerCase();if(!k)return;
 if(e.target.dataset.k!==k){e.target.dataset.k=k;hits=M.prims.filter(p=>p.k==='T'&&p.s.toLowerCase().includes(k));hi=0}else hi=(hi+1)%(hits.length||1);
 if(!hits.length){mark=null;st('Không tìm thấy “'+k+'”');draw();return}
 const p=hits[hi];mark=p;vis.add(p.lv);const cb=root.querySelector(`#lv input[data-l="${p.lv}"]`);if(cb)cb.checked=true;
 V.cx=p.x+p.w/2;V.cy=p.y;V.s=Math.max(V.s,60*d/(p.h*1.25));setPin({x:p.x+p.w/2,y:p.y+p.h/2});st(`Kết quả ${hi+1}/${hits.length}: “${p.s}” — Enter để xem kết quả tiếp`);draw()};
// pan / zoom / pinch
const P=new Map();let pd=0;
let dn=null;cv.onpointerdown=e=>{dn=[e.clientX,e.clientY,Date.now(),P.size];cv.setPointerCapture(e.pointerId);P.set(e.pointerId,[e.clientX,e.clientY]);pd=0};
cv.onpointerup=cv.onpointercancel=e=>{if(e.type==='pointerup'&&(pinMode||alMode)&&M&&dn&&!dn[3]&&Math.hypot(e.clientX-dn[0],e.clientY-dn[1])<6&&Date.now()-dn[2]<600){const r=cv.getBoundingClientRect(),px=(e.clientX-r.left)*d,py=(e.clientY-r.top)*d;tapAt(px,py)}P.delete(e.pointerId);pd=0};
cv.onpointermove=e=>{const r=cv.getBoundingClientRect(),px=(e.clientX-r.left)*d,py=(e.clientY-r.top)*d;
 if(M){const x=(px-cv.width/2)/V.s+V.cx,y=V.cy+(cv.height/2-py)/V.s,o=M.org;
  if(!P.size)$('st').dataset.c=`X(Bắc)=${((y-o[1])/1000).toFixed(2)}  Y(Đông)=${((x-o[0])/1000).toFixed(2)}`,$('st').textContent=$('st').dataset.c}
 if(!P.has(e.pointerId))return;const o=P.get(e.pointerId);
 if(P.size===1){V.cx-=(e.clientX-o[0])*d/V.s;V.cy+=(e.clientY-o[1])*d/V.s;P.set(e.pointerId,[e.clientX,e.clientY]);redraw()}
 else if(P.size===2){P.set(e.pointerId,[e.clientX,e.clientY]);const[a,b]=[...P.values()],n=Math.hypot(a[0]-b[0],a[1]-b[1]);if(pd)zoomAt(((a[0]+b[0])/2-r.left)*d,((a[1]+b[1])/2-r.top)*d,n/pd);pd=n}};
cv.onwheel=e=>{e.preventDefault();const r=cv.getBoundingClientRect();zoomAt((e.clientX-r.left)*d,(e.clientY-r.top)*d,Math.exp(-e.deltaY*.0015))};
$('mz').onchange=()=>draw();$('mn').onclick=()=>{const a=$('adv');a.style.display=a.style.display==='flex'?'none':'flex';size()};
$('lib').onclick=async()=>{const l=$('ll');if(l.style.display==='block'){l.style.display='none';return}
 let ks=[];try{ks=await dbKeys()}catch(e){}
 l.innerHTML='<b>Thư viện bản đồ (lưu trên máy này)</b>'+(ks.length?ks.map((k,i)=>`<div class="lr"><span>${esc(k)}</span><button data-o="${i}">Mở</button><button data-d="${i}">Xóa</button></div>`).join(''):'<p>Chưa có bản đồ nào. Bấm “Mở” để chọn file .dgn.</p>');
 l.onclick=async e=>{const o=e.target.dataset.o,x=e.target.dataset.d;if(o!=null){l.style.display='none';try{localStorage.setItem('last',ks[o])}catch(z){}await loadBuf(ks[o],new Uint8Array(await dbGet(ks[o])),false)}else if(x!=null){await dbDel(ks[x]);try{if(localStorage.getItem('last')===ks[x])localStorage.removeItem('last')}catch(z){}$('lib').onclick();$('lib').onclick()}};l.style.display='block'};
$('gps').onclick=()=>{if(gw!=null){navigator.geolocation.clearWatch(gw);gw=null;gp=null;gpf=0;$('gps').classList.remove('on');draw();return}
 if(!M){st('Hãy mở bản đồ trước');return}if(!navigator.geolocation){st('Thiết bị không hỗ trợ định vị');return}
 gw=navigator.geolocation.watchPosition(p=>{const u=fromLL(p.coords.latitude,p.coords.longitude);gp={x:u[0],y:u[1],acc:p.coords.accuracy};
  if(!gpf){gpf=1;const km=Math.hypot(u[0]-V.cx,u[1]-V.cy)/1e6;if(km<3){V.cx=u[0];V.cy=u[1];V.s=Math.max(V.s,.0015*d)}else st(`Bạn cách bản đồ khoảng ${km.toFixed(1)} km`)}
  draw()},e=>st('Không lấy được vị trí: '+e.message+(location.protocol==='https:'?'':' (định vị cần mở bằng HTTPS)')),{enableHighAccuracy:true,maximumAge:2000});$('gps').classList.add('on')};
addEventListener('resize',size);
const initMap=async()=>{try{const n=localStorage.getItem('last');if(n){const b=await dbGet(n);if(b)await loadBuf(n,new Uint8Array(b),false)}}catch(e){}};


var started=false;
return {show:function(){size();if(!started){started=true;initMap()}}};
}

/* ---------- khung chung ---------- */
(function(){
  var MODS=[
    {id:'bpkt',label:'Hồ sơ BPKT',tpl:'tpl-bpkt',mount:mountBpkt},
    {id:'law',label:'Pháp luật đất đai',tpl:'tpl-law',mount:mountLaw},
    {id:'map',label:'Bản đồ DGN',tpl:'tpl-map',mount:mountMap}
  ];
  var nav=document.getElementById('nav'),stage=document.getElementById('stage'),cur=null;
  function theme(){var t=document.documentElement.getAttribute('data-theme');if(t==='dark'||t==='light')return t;return matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}
  function applyTheme(){var t=theme();MODS.forEach(function(m){m.host.setAttribute('data-theme',t)})}
  MODS.forEach(function(m){
    var b=document.createElement('button');b.type='button';b.role='tab';b.textContent=m.label;b.id='tab-'+m.id;
    b.onclick=function(){go(m.id)};nav.appendChild(b);m.btn=b;
    var h=document.createElement('div');h.className='mod';h.hidden=true;stage.appendChild(h);m.host=h;
    var r=h.attachShadow({mode:'open'});r.appendChild(document.getElementById(m.tpl).content.cloneNode(true));
    try{m.api=m.mount(r)}catch(e){console.error(m.id,e);r.appendChild(Object.assign(document.createElement('p'),{textContent:'Không khởi động được mục "'+m.label+'": '+e.message,style:'padding:16px'}))}
  });
  applyTheme();
  new MutationObserver(applyTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);
  function go(id){
    cur=id;
    MODS.forEach(function(m){var on=m.id===id;m.host.hidden=!on;m.btn.setAttribute('aria-selected',on)});
    try{localStorage.setItem('vpdk.tab',id)}catch(e){}
    var m=MODS.filter(function(x){return x.id===id})[0];
    if(m.api&&m.api.show)try{m.api.show()}catch(e){console.error(e)}
  }
  var start='bpkt';try{var s=localStorage.getItem('vpdk.tab');if(MODS.some(function(m){return m.id===s}))start=s}catch(e){}
  go(start);
})();
</script>
